name: Docker Image CI
env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  BACKEND_URL: ${{ secrets.BACKEND_URL }}
  WEBSOCKET_URL: ${{ secrets.WEBSOCKET_URL }}
  
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      name: Check out code
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_PAT }}
    -
      name: Docker Build and Push API
      run: docker buildx build --push --build-arg SUPABASE_URL=${{ secrets.SUPABASE_URL }} --build-arg SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }} --platform linux/amd64,linux/arm64 -f ./backend/Dockerfile -t ansharyan03/triviate-api:latest ./backend
    - 
      name: Docker Build and Push Web
      run: docker buildx build --push --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_OR_ANON_KEY=${{ secrets.SUPABASE_SERVICE_KEY }} --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }} --build-arg NEXT_PUBLIC_BACKEND_URL=${{ secrets.BACKEND_URL }} --build-arg NEXT_PUBLIC_WEBSOCKET_URL=${{ secrets.WEBSOCKET_URL }} --platform linux/amd64,linux/arm64 -f ./frontend/Dockerfile -t ansharyan03/triviate:latest ./frontend
